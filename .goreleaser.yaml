version: 2
project_name: jdiff

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
  # Scoop needs an archive; only Windows gets one.
  - id: zip
    formats: [zip]
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: darwin
        formats: [none]
    files: [README.md, LICENSE]

nfpms:
  - package_name: jdiff
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/ObiWahn/jdiff
    description: Interactive terminal diff viewer with manual line alignment
    maintainer: "Jan Christoph Uhde"
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    # gitsrc and the theme's git config call git.
    dependencies: [git]
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/jdiff/LICENSE

checksum:
  name_template: sha256sums.txt

changelog:
  use: github-native

release:
  github:
    owner: ObiWahn
    name: jdiff

homebrew_casks:
  - name: jdiff
    ids: [binary]
    homepage: https://github.com/ObiWahn/jdiff
    description: Interactive terminal diff viewer with manual line alignment
    skip_upload: auto
    repository:
      owner: ObiWahn
      name: jdiff
      branch: master
    # Releases are unsigned; remove quarantine only from the staged binary,
    # the one file in StagedPath.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
          end

scoops:
  - name: jdiff
    ids: [zip]
    homepage: https://github.com/ObiWahn/jdiff
    description: Interactive terminal diff viewer with manual line alignment
    license: MIT
    skip_upload: auto
    directory: bucket
    repository:
      owner: ObiWahn
      name: jdiff
      branch: master
