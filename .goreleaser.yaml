version: 2
project_name: jdiff

before:
  hooks:
    # The completion scripts that the archives and packages carry.
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run . completion "$s" > "completions/jdiff.$s"; done'

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: [-s -w]

checksum:
  name_template: sha256sums.txt

archives:
  - id: archive
    formats: [tar.gz]
    name_template: &name_template "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # In place of the default files: the licenses, the README and the
    # completion scripts.
    files: [LICENSE*, README*, completions/*]
  - id: binary
    formats: [binary]
    name_template: *name_template

homebrew_casks:
  - ids: [archive]
    homepage: &homepage https://github.com/ObiWahn/jdiff
    description: &description Interactive terminal diff viewer with manual line alignment
    skip_upload: auto
    completions:
      bash: completions/jdiff.bash
      zsh: completions/jdiff.zsh
      fish: completions/jdiff.fish
    repository: &repository
      owner: ObiWahn
      name: jdiff
      branch: master
    # Releases are unsigned; remove quarantine only from the staged binary.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/jdiff"]
          end

nfpms:
  - file_name_template: "{{ .ConventionalFileName }}"
    homepage: *homepage
    description: *description
    maintainer: "Jan Christoph Uhde <jan@uhde.io>"
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    # gitsrc and the theme's git config call git.
    dependencies: [git]
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/jdiff/LICENSE
      - src: LICENSE-THIRD-PARTY
        dst: /usr/share/licenses/jdiff/LICENSE-THIRD-PARTY
      - src: completions/jdiff.bash
        dst: /usr/share/bash-completion/completions/jdiff
      - src: completions/jdiff.fish
        dst: /usr/share/fish/vendor_completions.d/jdiff.fish
      # zsh looks in vendor-completions on Debian, in site-functions elsewhere.
      - src: completions/jdiff.zsh
        dst: /usr/share/zsh/vendor-completions/_jdiff
        packager: deb
      - src: completions/jdiff.zsh
        dst: /usr/share/zsh/site-functions/_jdiff
        packager: rpm
      - src: completions/jdiff.zsh
        dst: /usr/share/zsh/site-functions/_jdiff
        packager: apk
      - src: completions/jdiff.zsh
        dst: /usr/share/zsh/site-functions/_jdiff
        packager: archlinux

scoops:
  - ids: [archive]
    homepage: *homepage
    description: *description
    license: MIT
    skip_upload: auto
    directory: bucket
    repository: *repository

changelog:
  use: github-native

release:
  github:
    owner: ObiWahn
    name: jdiff
  # GitHub sorts the assets by name; this shows the downloads in our order.
  header: |
    ## Downloads

    **Checksums:** [sha256sums.txt](https://github.com/ObiWahn/jdiff/releases/download/{{ .Tag }}/sha256sums.txt)

    **Archives:**
    - Linux: [amd64](https://github.com/ObiWahn/jdiff/releases/download/{{ .Tag }}/jdiff-v{{ .Version }}-linux-amd64.tar.gz), [arm64](https://github.com/ObiWahn/jdiff/releases/download/{{ .Tag }}/jdiff-v{{ .Version }}-linux-arm64.tar.gz)
    - macOS: [arm64](https://github.com/ObiWahn/jdiff/releases/download/{{ .Tag }}/jdiff-v{{ .Version }}-darwin-arm64.tar.gz), [amd64](https://github.com/ObiWahn/jdiff/releases/download/{{ .Tag }}/jdiff-v{{ .Version }}-darwin-amd64.tar.gz)
    - Windows: [amd64](https://github.com/ObiWahn/jdiff/releases/download/{{ .Tag }}/jdiff-v{{ .Version }}-windows-amd64.zip)

    **Homebrew:** `brew install --cask obiwahn/jdiff/jdiff`

    **Others:** the Linux packages and bare binaries are under Assets below.

    **Test coverage:** [report](https://obiwahn.github.io/jdiff/{{ .Tag }}/coverage.html)
