version: 2
project_name: jdiff

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: sha256sums.txt

changelog:
  use: github-native

release:
  github:
    owner: ObiWahn
    name: jdiff

homebrew_casks:
  - name: jdiff
    homepage: https://github.com/ObiWahn/jdiff
    description: Interactive terminal diff viewer with manual line alignment
    skip_upload: auto
    repository:
      owner: ObiWahn
      name: jdiff
      branch: master
    # Releases are unsigned; remove quarantine only from the staged binary.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/jdiff"]
          end
