# The keys of all pages, for consulting, and the order of the settings: the popup and the help's
# block of settings follow the rows of everywhere, by their first key (OrderSettings).
# It binds no key: the code handles them, and the bindings in help.go are the help's text.
# doc/keybindings.md lists the same keys in the same order; TestKeybindingsDoc checks that.

commit_list = [
    { keys = ["j", "k"], what = "move" },
    { keys = ["N", "P", "n", "p"], what = "next, previous commit in history" },
    { keys = ["pgup", "pgdn", "ctrl+b", "ctrl+f"], what = "page up, down" },
    { keys = ["home", "end"], what = "first, last commit" },
    { keys = ["enter"], what = "show the files of the commit" },
    { keys = ["f"], what = "flow view of all commits" },
]

file_list = [
    { keys = ["j", "k", "n", "p"], what = "move" },
    { keys = ["pgup", "pgdn", "ctrl+b", "ctrl+f"], what = "scroll the diff preview; page while it is hidden" },
    { keys = ["home", "end"], what = "first, last file" },
    { keys = ["enter"], what = "show the diff of the file" },
    { keys = ["'<letter>"], what = "open the file of a jump mark" },
    { keys = ["N", "P"], what = "next, previous commit in history (in the log)" },
    { keys = ["f"], what = "flow view of all files" },
    { keys = ["backspace"], what = "back to the commits (in the log)" },
]

