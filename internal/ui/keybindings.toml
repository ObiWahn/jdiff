# The keys of the diff view, and:
flow_view = [
    { keys = ["n", "p"], what = "next, previous file bar" },
    { keys = ["N", "P"], what = "next, previous commit bar in history" },
    { keys = ["f"], what = "single file view" },
    { keys = ["c"], what = "full or short commit messages, in the log" },
    { keys = ["C"], what = "stay in the current commit, in the log" },
]

