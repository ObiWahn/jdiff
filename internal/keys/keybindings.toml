# The keys of all pages, the words shown for them and the order of the settings.
#
# A row: action names what the keys do, and several rows may share one, keys are the keys, help
# describes them. label is the word in the status bar, by the state of the action: [on, off], or one
# word for an action without states. No word there means that the status bar leaves the key out; the
# status bar's order is in statusKeys. setting is what a setting does while on, in the settings popup.
#
# An action is looked up in everywhere, diff_view, flow_view, commit_list, file_list and doc_view, in
# this order; the first row found gives the keys and the words.
#
# A key pressed is looked up in the rows of its page, for the flow view then in those of diff_view,
# then in everywhere; the first row with it decides the action. Actions that go two ways take the
# place of the key in its row: the first key of move, next_file, history, change, match, link and
# next_page goes forward or down, the first of page, half_page, ends, scroll and line_link back, up or
# left. Key names are
# Bubble Tea's, also pgdn for pgdown and F5 for f5; <letter> stands for the letter typed next.
#
# In help, setting and note, {action} stands for the keys of the first row of action, {action:1} for
# those of its second row: the words follow the keys of the user's keybindings.toml.
#
# The rows of everywhere decide the order of the settings, by their first key (Map.Order).
# doc/keybindings.md lists the same keys in the same order; TestKeybindingsDoc checks that.

everywhere = [
    { action = "marks", keys = ["\\"], help = "jump marks: enter jumps, d or del deletes, {marks} esc q close" },
    { action = "git_diff", keys = ["d"], label = ["git diff"], help = "popup: show git diff ARGS instead; ↑ the current ARGS, enter show" },
    { action = "layout", keys = ["s"], label = ["unified", "split"], help = "side by side or normal layout, also of the preview", setting = "side by side layout" },
    { action = "flow", keys = ["f"], label = ["file", "flow"], help = "flow view of all files or commits; in it, the single file view", setting = "flow view of all files or commits" },
    { action = "untracked", keys = ["u"], help = "also show untracked files, in a git diff; not saved", setting = "also show untracked files, in a git diff" },
    { action = "wrap", keys = ["w"], help = "wrap long lines or cut them", setting = "wrap long lines" },
    { action = "whitespace", keys = ["W"], help = "show all whitespace and line ends or only changed", setting = "show all whitespace and line ends" },
    { action = "mark_whitespace", keys = ["ctrl+w"], help = "mark changed whitespace or not", setting = "mark changed whitespace" },
    { action = "trailing", keys = ["t"], help = "show trailing whitespace or not", setting = "show trailing whitespace" },
    { action = "line_ends", keys = ["e"], help = "show all \\r\\n line ends (␍) or only changed", setting = "show all \\r\\n line ends (␍)" },
    { action = "bold", keys = ["b"], help = "bold or plain changed words", setting = "bold changed words" },
    { action = "preview", keys = ["v"], help = "show or hide the message box or diff preview", setting = "show the message box, the diff preview" },
    { action = "settings", keys = ["o", "F8"], label = ["settings"], help = "a popup with these settings, to find them" },
    { action = "reload", keys = ["r", "F5", "ctrl+r"], help = "load again: git diff, git log, the directories or the files" },
    { action = "auto_reload", keys = ["R"], help = "auto reload: load again when the repository changes; off at each start" },
    { action = "auto_reload_timeout", setting = "minutes without keys or changes until auto reload ends; 0 never" },
    { action = "help", keys = ["?"], label = ["help"], help = "this help ({help} esc q close, j k scroll)" },
    { action = "quit", keys = ["q", "ctrl+c"], label = ["quit"], help = "quit" },
]

diff_view = [
    { action = "anchor", keys = ["enter"], label = ["mark/anchor"], help = "mark a line, then its partner: anchor" },
    { action = "cancel_mark", keys = ["esc"], help = "cancel the mark" },
    { action = "fold", keys = ["space"], help = "fold or unfold unchanged code" },
    { action = "fold_all", keys = ["ctrl+space"], help = "fold or unfold all of the file" },
    { action = "move", keys = ["j", "k"], help = "move" },
    { action = "move", keys = ["down", "up"], help = "move" },
    { action = "page", keys = ["pgup", "pgdn"], help = "page up, down (also {page:1}); the file list scrolls its preview" },
    { action = "page", keys = ["ctrl+b", "ctrl+f"], help = "page up, down" },
    { action = "half_page", keys = ["ctrl+u", "ctrl+d"], help = "half page up, down" },
    { action = "ends", keys = ["home", "end"], help = "first, last; top, bottom" },
    { action = "scroll", keys = ["h", "l"], help = "scroll left, right, unless lines are wrapped" },
    { action = "scroll", keys = ["left", "right"], help = "scroll left, right" },
    { action = "change", keys = ["]", "["], help = "next, previous change" },
    { action = "next_file", keys = ["n", "p"], help = "next, previous file; in the commit list commit" },
    { action = "history", keys = ["N", "P"], label = ["commit"], help = "next, previous commit in history (in the log)" },
    { action = "pane", keys = ["tab"], help = "switch pane" },
    { action = "search", keys = ["/"], help = "search: enter find, tab changed or all lines, shift+tab text or regex" },
    { action = "match", keys = [".", ","], help = "next, previous match; in the flow view in all files of the commit" },
    { action = "moved", keys = ["g"], help = "go to the other end of moved code (magenta: moved away, cyan: moved here)" },
    { action = "set_mark", keys = ["m<letter>"], help = "set a jump mark on the line of the new file" },
    { action = "jump", keys = ["'<letter>"], help = "jump to a mark, when its file is in this diff" },
    { action = "flow", keys = ["f"], help = "flow view" },
    { action = "to_files", keys = ["backspace"], label = ["files"], help = "back to the file list; from it to the commits (in the log)" },
]

# The keys of the diff view, and:
flow_view = [
    { action = "next_file", keys = ["n", "p"], help = "next, previous file bar" },
    { action = "history", keys = ["N", "P"], help = "next, previous commit bar in history" },
    { action = "flow", keys = ["f"], help = "single file view" },
    { action = "full_messages", keys = ["c"], help = "full or short commit messages", setting = "full commit messages, in the log's flow view" },
    { action = "stay_in_commit", keys = ["C"], help = "stay in the current commit ({history} still switch)", setting = "stay in the current commit, there ({history} still switch)" },
]

commit_list = [
    { action = "move", keys = ["j", "k"], help = "move" },
    { action = "move", keys = ["down", "up"], help = "move" },
    { action = "history", keys = ["N", "P"], help = "next, previous commit in history" },
    { action = "history", keys = ["n", "p"], help = "next, previous commit in history" },
    { action = "page", keys = ["pgup", "pgdn"], help = "page up, down" },
    { action = "page", keys = ["ctrl+b", "ctrl+f"], help = "page up, down" },
    { action = "ends", keys = ["home", "end"], help = "first, last commit" },
    { action = "open", keys = ["enter"], label = ["open"], help = "show the files of the commit, the diff of the file" },
    { action = "jump", keys = ["'<letter>"], help = "a mark: says to open a commit to jump to it" },
    { action = "flow", keys = ["f"], help = "flow view of all commits" },
]

file_list = [
    { action = "move", keys = ["j", "k"], help = "move" },
    { action = "move", keys = ["down", "up"], help = "move" },
    { action = "move", keys = ["n", "p"], help = "move" },
    { action = "page", keys = ["pgup", "pgdn"], help = "scroll the diff preview; page while it is hidden" },
    { action = "page", keys = ["ctrl+b", "ctrl+f"], help = "scroll the diff preview; page while it is hidden" },
    { action = "ends", keys = ["home", "end"], help = "first, last file" },
    { action = "open", keys = ["enter"], help = "show the diff of the file" },
    { action = "jump", keys = ["'<letter>"], help = "open the file of a jump mark" },
    { action = "history", keys = ["N", "P"], help = "next, previous commit in history (in the log)" },
    { action = "flow", keys = ["f"], help = "flow view of all files" },
    { action = "to_commits", keys = ["backspace"], label = ["commits"], help = "back to the commits (in the log)" },
]

# The pages of jdiff --readme: the README and the documentation it links to.
doc_view = [
    { action = "move", keys = ["j", "k"], help = "move the cursor" },
    { action = "move", keys = ["down", "up"], help = "move the cursor" },
    { action = "page", keys = ["pgup", "pgdn"], help = "page up, down" },
    { action = "page", keys = ["ctrl+b", "ctrl+f"], help = "page up, down" },
    { action = "half_page", keys = ["ctrl+u", "ctrl+d"], help = "half page up, down" },
    { action = "ends", keys = ["home", "end"], help = "top, bottom" },
    { action = "link", keys = ["tab", "shift+tab"], help = "the next, previous link" },
    { action = "line_link", keys = ["h", "l"], help = "the link left, right on the cursor's line" },
    { action = "line_link", keys = ["left", "right"], help = "the link left, right on the cursor's line" },
    { action = "follow", keys = ["enter"], label = ["follow"], help = "follow the link on the cursor's line: open its page or heading; a web address is shown" },
    { action = "back", keys = ["backspace"], label = ["back"], help = "back to where the link was followed" },
    { action = "next_page", keys = ["n", "p"], help = "next, previous page" },
    { action = "search", keys = ["/"], help = "search the page" },
    { action = "match", keys = [".", ","], help = "next, previous match" },
]

