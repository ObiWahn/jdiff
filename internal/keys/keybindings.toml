# The lines of the help popup: an action gives its keys and its help; a heading stands alone, a note
# goes on from the line above. The settings among them follow the order of everywhere.
# The popups, the input lines and the screen shown while the terminal is too small. A popup looks
# a key up in its own table, then in popup; an input line in its own, then in input_line. The key
# that opened a popup closes it too.
