    { action = "close", keys = ["esc", "q"], label = ["close"], help = "close the popup" },
    { action = "quit", keys = ["ctrl+c"], help = "quit" },
    { action = "move", keys = ["down", "up"], help = "move down, up" },
    { action = "move", keys = ["j", "k"], help = "move down, up" },
]
