name: ci

on:
  push:
    branches: ["**"] # every branch; only a tag makes a release
    tags: ["v*"] # a release, see the job release
  schedule:
    - cron: "0 6 * * 1" # new vulnerabilities turn up without changes to the code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TEST_TIMEOUT: 300s # 15s is for local runs, not a cold cache with -race
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make build
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs
          path: bin/*.log

  # Outside Linux files are checked by polling, not inotify. The tests run
  # without make: macOS has make 3.81, which lacks .SHELLFLAGS, and timeout
  # is missing on macOS and another program on Windows.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: go test -count=1 -timeout 5m ./...
      - run: go build -o jdiff-ci .

  # Exercise the same packaging as a release without publishing from branches.
  # GoReleaser builds all five targets from .goreleaser.yaml.
  dist:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jdiff-snapshot
          path: |
            dist/jdiff_*/jdiff*
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/sha256sums.txt
            dist/homebrew
            dist/scoop

  # Install the snapshot packages where they belong; each must pull in git.
  # The tests run in docker, not as a job container: actions need glibc,
  # which Alpine lacks. archlinux has no arm64 image.
  packages:
    needs: [dist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: "debian:stable", install: "apt-get update -qq && apt-get install -y ./jdiff_*_amd64.deb" }
          - { runner: ubuntu-latest, image: "fedora:latest", install: "dnf install -y ./jdiff-*.x86_64.rpm" }
          - { runner: ubuntu-latest, image: "alpine:latest", install: "apk add --allow-untrusted ./jdiff_*_x86_64.apk" }
          - { runner: ubuntu-latest, image: "archlinux:latest", install: "pacman -Sy --noconfirm && pacman -U --noconfirm ./jdiff-*-x86_64.pkg.tar.zst" }
          - { runner: ubuntu-24.04-arm, image: "debian:stable", install: "apt-get update -qq && apt-get install -y ./jdiff_*_arm64.deb" }
          - { runner: ubuntu-24.04-arm, image: "fedora:latest", install: "dnf install -y ./jdiff-*.aarch64.rpm" }
          - { runner: ubuntu-24.04-arm, image: "alpine:latest", install: "apk add --allow-untrusted ./jdiff_*_aarch64.apk" }
    name: packages (${{ matrix.image }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: jdiff-snapshot
      - run: >
          docker run --rm -v "$PWD:/d" -w /d ${{ matrix.image }}
          sh -c '${{ matrix.install }} && jdiff --version && git --version'

  # Only upstream tags publish a release and update the upstream Homebrew tap.
  release:
    if: github.repository == 'ObiWahn/jdiff' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
