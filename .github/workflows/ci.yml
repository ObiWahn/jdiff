name: ci

on:
  push:
    branches: ["**"] # every branch; only a tag makes a release
    tags: ["v*"] # a release, see the job release
  schedule:
    - cron: "0 6 * * 1" # new vulnerabilities turn up without changes to the code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TEST_TIMEOUT: 300s # 15s is for local runs, not a cold cache with -race
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make cover
      - id: coverage
        run: |
          tail -n 1 bin/cover.log >> "$GITHUB_STEP_SUMMARY"
          echo "total=$(tail -n 1 bin/cover.log | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: bin/coverage.html
      - run: make build
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs
          path: bin/*.log

  # Outside Linux files are checked by polling, not inotify. The tests run
  # without make: macOS has make 3.81, which lacks .SHELLFLAGS, and timeout
  # is missing on macOS and another program on Windows.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: go test -count=1 -timeout 5m ./...
      - run: go build -o jdiff-ci .

  # Exercise the same packaging as a release without publishing from branches.
  # GoReleaser builds all five targets from .goreleaser.yaml.
  dist:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jdiff-snapshot
          path: |
            dist/jdiff_*/jdiff*
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/sha256sums.txt
            dist/homebrew
            dist/scoop

  # Install the snapshot packages where they belong; each must pull in git.
  # The tests run in docker, not as a job container: actions need glibc,
  # which Alpine lacks. archlinux has no arm64 image.
  packages:
    needs: [dist]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        image: ["debian:stable", "fedora:latest", "alpine:latest", "archlinux:latest"]
        exclude:
          - { runner: ubuntu-24.04-arm, image: "archlinux:latest" }
        include:
          - { image: "debian:stable", install: "apt-get update -qq && apt-get install -y ./jdiff_*_$(dpkg --print-architecture).deb" }
          - { image: "fedora:latest", install: "dnf install -y ./jdiff-*.$(uname -m).rpm" }
          - { image: "alpine:latest", install: "apk add --allow-untrusted ./jdiff_*_$(uname -m).apk" }
          - { image: "archlinux:latest", install: "pacman -Sy --noconfirm && pacman -U --noconfirm ./jdiff-*-$(uname -m).pkg.tar.zst" }
    name: packages (${{ matrix.image }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: jdiff-snapshot
      - run: >
          docker run --rm -v "$PWD:/d" -w /d ${{ matrix.image }}
          sh -c '${{ matrix.install }} && jdiff --version && git --version'

  # The README's badge reads coverage.json in the branch badges, so that the
  # commits stay out of master's history. A job of its own: only it may write.
  # Its commits start no workflow: they are made with the GITHUB_TOKEN.
  badge:
    if: github.repository == 'ObiWahn/jdiff' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - env:
          TOTAL: ${{ needs.linux.outputs.coverage }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 origin badges; then
            git checkout -q -b badges FETCH_HEAD
          else
            git checkout -q --orphan badges
            git rm -rfq .
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"blue"}\n' "$TOTAL" > coverage.json
          git add coverage.json
          git diff --cached --quiet && exit 0
          git commit -qm "Coverage $TOTAL"
          git push -q origin badges

  # Only upstream tags publish a release and update the upstream Homebrew tap.
  release:
    if: github.repository == 'ObiWahn/jdiff' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
