name: ci

on:
  push:
    branches: ["**"] # every branch; only a tag makes a release
    tags: ["v*"] # a release, see the job release
  schedule:
    - cron: "0 6 * * 1" # new vulnerabilities turn up without changes to the code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TEST_TIMEOUT: 300s # 15s is for local runs, not a cold cache with -race
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make build
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs
          path: bin/*.log

  # Outside Linux files are checked by polling, not inotify. The tests run
  # without make: macOS has make 3.81, which lacks .SHELLFLAGS, and timeout
  # is missing on macOS and another program on Windows.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: go test -count=1 -timeout 5m ./...
      - run: go build -o jdiff-ci .

  # Exercise the same packaging as a release without publishing from branches.
  # GoReleaser builds all five targets from .goreleaser.yaml.
  dist:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jdiff-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
            dist/homebrew

  # Only upstream tags publish a release and update the upstream Homebrew tap.
  release:
    if: github.repository == 'ObiWahn/jdiff' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
